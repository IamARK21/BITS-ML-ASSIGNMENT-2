[project]
name = "bits-ml-assignment-2"
version = "1.0.0"
description = "BITS ML Assignment 2 - Breast Cancer Classification with Multiple ML Models"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32",
    "scikit-learn==1.6.1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "altair>=5.0",
    "joblib>=1.3",
]

[project.scripts]
app = "app:main"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
